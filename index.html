<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>REP.</title>
<meta name="description" content="筋トレのセット・重量・回数を記録するアプリ">
<meta name="theme-color" content="#ECECEA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="REP.">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preload" href="fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
<style>
@font-face{font-family:"Barlow Condensed";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/barlow-condensed-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/barlow-condensed-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/barlow-condensed-latin-700-normal.woff2") format("woff2")}
/* Layout: phone-first one-screen app — fixed header, scrolling work area, rest-timer strip, bottom tab bar.
   Look: flat industrial — pale concrete greys, charcoal type, hairline frames, tight 6px corners,
   one safety-orange accent for the action that matters. Body parts keep muted barbell-plate colors. */
:root{
  --bg:#D8D9D7; --surface:#ECECEA; --surface-2:#C9CBC8; --ink:#383B3F; --ink-2:#64686D; --ink-3:#7F8388; --line:#B9BCB9;
  --accent:#F2661B; --accent-ink:#383B3F; --accent-soft:#F6DFD0; --danger:#C4302A; --good:#2F8656;
  --p-chest:#C8453F; --p-back:#3F63B8; --p-legs:#C09A1E; --p-shoulder:#3E8A5E; --p-arms:#6E7378; --p-core:#7458B8; --p-cardio:#2E8C95;
  --f-num:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Hiragino Sans","Hiragino Kaku Gothic ProN","ヒラギノ角ゴシック","Hiragino Kaku Gothic Pro","Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif;
  --r:6px;
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{box-sizing:border-box;background:var(--surface);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
body{-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
#updbar{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:#F3F3F1;padding:10px 12px;border-radius:6px;font-size:13px;font-weight:700;box-shadow:0 6px 20px rgb(0 0 0 / .25)}
#updbar button{background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:4px;padding:6px 12px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.ic{width:22px;height:22px;flex:none}
h2,h3{margin:0;text-wrap:balance}

#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
#top{display:grid;grid-template-columns:minmax(44px,auto) 1fr minmax(44px,auto);align-items:center;gap:8px;padding:8px 16px;min-height:56px;border-bottom:1px solid var(--line);background:var(--bg)}
#top h1{margin:0;font-size:17px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .brand{font-family:var(--f-num);font-weight:700;font-size:26px;letter-spacing:.08em;line-height:1}
#top .brand i{font-style:normal;color:var(--accent)}
.hbtn{display:inline-flex;align-items:center;justify-content:center;gap:2px;min-width:44px;height:44px;border-radius:12px;color:var(--ink)}
.hbtn:active{background:var(--surface-2)}
.hright{justify-self:end}
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 28px;display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
#main > *{flex-shrink:0}
#pickList > *,.card > .chips,section > .chips{flex-shrink:0}
#tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface)}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:11px;font-weight:500;color:var(--ink-3)}
#tabs button[aria-current="true"]{color:var(--accent)}

/* generic */
.card{background:var(--surface);border-radius:var(--r);padding:14px}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:.04em}
.muted{color:var(--ink-2)}
.small{font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;font-weight:700;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{min-height:54px;font-size:16px;width:100%}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:8px;font-size:13px;font-weight:700;color:var(--ink-2);min-height:32px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink-2);background:var(--surface);min-height:34px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c,var(--ink-3))}
.tf{width:100%;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:16px}
.tf:focus{border-color:var(--accent);outline:none}
select.tf{appearance:auto}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13px}
.empty{padding:22px 14px;text-align:center;color:var(--ink-2);font-size:14px}

/* home */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head h2{font-family:var(--f-num);font-size:26px;font-weight:700;letter-spacing:.02em}
.cal-head h2 small{font-size:15px;color:var(--ink-2);margin-left:6px;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-wd{font-size:11px;text-align:center;color:var(--ink-3);font-weight:700;padding-bottom:2px}
.cal-wd:first-child{color:var(--danger)}
.cal-day{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--f-num);font-size:17px;font-weight:600;color:var(--ink)}
.cal-day.out{color:var(--ink-3);opacity:.5}
.cal-day.on{background:var(--accent-soft)}
.cal-day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-dots{display:flex;gap:2px;height:6px}
.cal-dots .dot{width:6px;height:6px}
.cal-foot{display:flex;gap:18px;align-items:baseline;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink-2);font-weight:700}
.cal-foot b{font-family:var(--f-num);font-size:26px;color:var(--ink);margin:0 3px 0 6px}
.figs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 14px}
.fig{min-width:0}
.fig span{display:block;font-size:11px;color:var(--ink-2);font-weight:700}
.fig b{font-family:var(--f-num);font-size:28px;font-weight:700;line-height:1.1;white-space:nowrap}
.fig b small{font-size:15px;margin-left:2px;color:var(--ink-2)}
.weeks{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:12px}
.weeks .lbl{color:var(--ink-2);font-weight:700}
.weeks .trk{height:10px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.weeks .bar{height:100%;background:var(--accent);border-radius:0 3px 3px 0;opacity:.45}
.weeks .bar.cur{opacity:1}
.weeks .val{font-family:var(--f-num);font-size:14px;text-align:right;min-width:52px}

/* day */
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav h2{font-size:18px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--surface);border-radius:12px;padding:8px 10px;min-width:0}
.tile span{display:block;font-size:11px;color:var(--ink-2);font-weight:700;white-space:nowrap}
.tile b{font-family:var(--f-num);font-size:24px;font-weight:700;line-height:1.15;white-space:nowrap}
.tile b small{font-size:13px;color:var(--ink-2);margin-left:1px}
.wcard{background:var(--surface);border-radius:var(--r);overflow:hidden}
.whead{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 14px;border-left:4px solid var(--c)}
.whead .name{flex:1;min-width:0;text-align:left;font-weight:700;font-size:16px;padding:8px 0;display:flex;flex-direction:column}
.whead .name small{font-size:12px;color:var(--ink-2);font-weight:500}
.iconbtn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;color:var(--ink-2)}
.iconbtn:active{background:var(--surface-2)}
.iconbtn:disabled{opacity:.3}
.armed{background:var(--danger);color:#fff;border-radius:10px;padding:0 10px;height:40px;font-size:13px;font-weight:700}
.wsets{display:grid;grid-template-columns:auto auto auto 1fr;gap:2px 12px;padding:4px 14px 12px 18px;font-size:15px;align-items:baseline;width:100%;text-align:left}
.wsets .n{color:var(--ink-3);font-family:var(--f-num)}
.wsets .v{font-family:var(--f-num);font-size:18px;font-weight:600;white-space:nowrap}
.wsets .v small{font-size:12px;color:var(--ink-2);font-weight:500;margin-left:1px}
.wsets .rmv{font-family:var(--f-num);color:var(--ink-2);text-align:right;font-size:14px}
.wsets .note{grid-column:2/-1;font-size:12px;color:var(--ink-2);margin-top:-2px}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);vertical-align:2px;margin-left:4px;font-family:var(--f-body)}

/* picker */
.part{background:var(--surface);border-radius:var(--r);overflow:hidden}
.part-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.part-h h3{font-size:15px;font-weight:700;flex:1;min-width:0}
.part-h .since{font-size:12px;color:var(--ink-2);font-weight:500}
.exrow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);min-height:50px;padding:0 8px 0 14px}
.exrow:last-of-type{border-bottom:0}
.exrow .go{flex:1;min-width:0;text-align:left;padding:12px 0;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.exrow .go small{color:var(--ink-3);font-size:12px;white-space:nowrap}
.exrow .go .added{color:var(--accent);font-weight:700}
.exrow .tf{min-height:38px;font-size:15px}
.addrow{display:flex;gap:8px;padding:10px 14px;background:var(--bg);background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
.addrow .tf{min-height:40px;font-size:15px}
.swatch{width:26px;height:26px;border-radius:50%;background:var(--c);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}

/* exercise entry */
.extop{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.pb{flex:1 1 150px;background:var(--surface);border-radius:12px;padding:8px 12px;font-size:12px;color:var(--ink-2);font-weight:700;display:flex;gap:14px}
.pb div{min-width:0}
.pb b{display:block;font-family:var(--f-num);font-size:20px;color:var(--ink);line-height:1.2;white-space:nowrap}
.rest{flex:1 1 190px;display:flex;align-items:center;gap:4px;background:var(--surface);border-radius:12px;padding:4px 4px 4px 8px}
.rest .sec{font-family:var(--f-num);font-size:22px;font-weight:700;min-width:56px;text-align:center}
.rest .btn{margin-left:auto;min-height:40px}
.last{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.last .grow{font-size:14px}
.last .when{font-size:12px;color:var(--ink-2);font-weight:700;margin-bottom:2px}
.last .ls{font-family:var(--f-num);font-size:16px;display:flex;flex-wrap:wrap;gap:2px 12px}
.sets{display:flex;flex-direction:column;gap:8px}
.set{background:var(--surface);border-radius:12px;padding:8px 8px 6px 10px;border:1px solid transparent}
.set.done{border-color:var(--good);background:color-mix(in srgb,var(--good) 7%,var(--surface))}
.set-main{display:flex;align-items:center;gap:6px}
.set-no{font-size:22px;font-weight:700;width:22px;text-align:center;color:var(--ink-2)}
.fld{flex:1;min-width:0;display:flex;align-items:baseline;gap:3px;border-bottom:2px solid var(--line);padding:0 2px}
.fld:focus-within{border-color:var(--accent)}
.fld input{width:100%;min-width:0;border:0;background:transparent;font-family:var(--f-num);font-size:26px;font-weight:700;text-align:right;padding:2px 0;outline:none}
.fld input::placeholder{color:var(--ink-3);opacity:.6;font-weight:500}
.fld span{font-size:12px;color:var(--ink-2);font-weight:700}
.x{color:var(--ink-3);font-size:14px}
.done-btn{width:46px;height:46px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--line);color:var(--ink-3);flex:none}
.done-btn[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.set-sub{display:flex;align-items:center;gap:4px;margin-top:4px}
.set-sub .rm{font-size:13px;color:var(--ink-2);min-width:66px;white-space:nowrap}
.set-sub .memo{flex:1;min-width:0;border:0;border-bottom:1px dashed var(--line);background:transparent;font-size:14px;padding:6px 2px;outline:none}
.set-sub .memo:focus{border-bottom-color:var(--accent)}
.mini{height:34px;min-width:34px;padding:0 8px;border-radius:8px;font-size:12px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center}
.mini .ic{width:18px;height:18px}
.mini.on{background:var(--ink);color:var(--bg)}
.mini:active{background:var(--surface-2)}

/* timer strip */
#timerbar{background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:10px;padding:8px 16px;position:relative;overflow:hidden}
#timerbar .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
#timerbar .t{font-family:var(--f-num);font-size:30px;font-weight:700;line-height:1}
#timerbar .lbl{font-size:12px;font-weight:700;opacity:.75;flex:1}
#timerbar button{min-height:36px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:700;border:1px solid color-mix(in srgb,var(--bg) 35%,transparent)}
#timerbar.fin{background:var(--good);color:#fff}
#timerbar.fin button{border-color:rgb(255 255 255 / .5)}

/* charts */
.chart{position:relative;touch-action:pan-y}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--ink-3);font-family:var(--f-num);font-size:11px}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.1}
.chart .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .endlbl{fill:var(--ink);font-family:var(--f-num);font-size:13px;font-weight:700}
.chart .guide{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3}
.chart .hi{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.chart .tip{position:absolute;top:-6px;transform:translate(-50%,-100%);background:var(--ink);color:var(--bg);padding:4px 9px;border-radius:8px;font-size:12px;white-space:nowrap;pointer-events:none;display:flex;gap:8px;align-items:baseline}
.chart .tip b{font-family:var(--f-num);font-size:16px}
.chart-empty{padding:28px 10px;text-align:center;color:var(--ink-2);font-size:13px;background:var(--surface-2);border-radius:10px}
.hcal .cal-day{font-size:15px;gap:0}
.hcal .cal-day em{font-style:normal;font-size:10px;color:var(--ink-2);line-height:1}
.pbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sess{display:flex;flex-direction:column}
.sess button{display:grid;grid-template-columns:70px 1fr;gap:8px;text-align:left;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.sess button:last-child{border-bottom:0}
.sess .d{font-family:var(--f-num);font-weight:700;color:var(--ink-2)}
.sess .s{font-family:var(--f-num);font-size:15px}

/* body */
.bfields{display:flex;flex-direction:column}
.bf{display:grid;grid-template-columns:1fr 120px 44px;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.bf:last-child{border-bottom:0}
.bf label{font-weight:700;font-size:15px}
.bf input{border:0;border-bottom:2px solid var(--line);background:transparent;font-family:var(--f-num);font-size:24px;font-weight:700;text-align:right;width:100%;padding:2px 0;outline:none}
.bf input:focus{border-color:var(--accent)}
.bf input::placeholder{color:var(--ink-3);opacity:.6;font-weight:500}
.bf .u{font-size:12px;color:var(--ink-2);font-weight:700}
.bcalc{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bcalc div span{display:block;font-size:11px;font-weight:700;color:var(--ink-2)}
.bcalc div b{font-family:var(--f-num);font-size:24px}
.bcalc div b small{font-size:12px;color:var(--ink-2);margin-left:2px}

/* rm */
.rm-in{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.rm-in .fld input{font-size:34px}
.rm-out{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.rm-out span{font-size:13px;font-weight:700;color:var(--ink-2)}
.rm-out b{font-family:var(--f-num);font-size:52px;line-height:1;font-weight:700;color:var(--accent)}
.rm-out b small{font-size:20px;color:var(--ink-2);margin-left:4px}
.tblwrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-size:11px;color:var(--ink-2);text-align:right;padding:6px 8px;font-weight:700;border-bottom:1px solid var(--line)}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);font-family:var(--f-num);font-size:17px}
table.t tr:last-child td{border-bottom:0}
table.t tr.hl td{background:var(--accent-soft);font-weight:700}
table.t td.pct{color:var(--ink-2);font-size:15px}

/* settings */
.setlist{display:flex;flex-direction:column}
.si{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.si:last-child{border-bottom:0}
.si > span{font-weight:700;font-size:15px}
.si small{display:block;font-weight:400;color:var(--ink-2);font-size:12px}
.si .tf{width:auto;min-width:0;max-width:100%}

const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseK = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };

const daysBetween = (a, b) => Math.round((parseK(b) - parseK(a)) / 864e5);
const WD = ["日","月","火","水","木","金","土"];
const fmtDate = k => { const d = parseK(k); return `${d.getMonth()+1}月${d.getDate()}日(${WD[d.getDay()]})`; };
const fmtMD = k => { const d = parseK(k); return `${d.getMonth()+1}/${d.getDate()}`; };

/* ---------- persistence: this device + private cloud backup ---------- */
const dirty = new Set();
let db = null, cloudUid = null, cloudState = "connecting", flushTimer = null, flushing = false;

function markDirty(k){

function monthDays(mk){ const o = {}; for (const [k,v] of Object.entries(state.days)) if (k.startsWith(mk)) o[k] = v; return o; }
async function flush(){
  if (!db || !cloudUid || flushing) return;
  flushing = true;
  try {
    let retries = 0;
    while (dirty.size) {
      const k = dirty.values().next().value;
      dirty.delete(k);
      const ref = db.doc(`data/users/${cloudUid}/${k === "meta" ? "meta" : "m-" + k}`);
      const body = k === "meta"
        ? { updatedAt: state._mt.meta || Date.now(), settings: state.settings, parts: state.parts }
        : { updatedAt: state._mt[k] || Date.now(), days: monthDays(k) };
      try { await ref.set(clone(body)); cloudState = "on"; }
      catch(e) {
        const code = e && e.code;
        if (code === "unavailable" && retries < 2) { retries++; dirty.add(k); await sleep(1200 + Math.random()*1200); continue; }
        dirty.add(k);
        if (code === "quota_exceeded") toast("クラウドの保存容量がいっぱいです。端末には保存されています");

}
async function initCloud(){

    if (!window.claude || typeof window.claude.use !== "function") { cloudState = "off"; return; }
    const [d, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    const id = u ? await u.id() : null;
    if (!d || !id) { cloudState = "off"; return; }
    db = d; cloudUid = id;
    const snap = await db.collection(`data/users/${id}`).limit(1000).get();
    const remote = {};
    snap.docs.forEach(s => { if (s.exists) remote[s.id] = s.data(); });
    let changed = false;
    const rm = remote.meta;
    if (rm && Array.isArray(rm.parts) && (rm.updatedAt||0) > (state._mt.meta||0)) {
      state.settings = {...DEFAULT_SETTINGS, ...(rm.settings||{})};
      state.parts = clone(rm.parts);
      state._mt.meta = rm.updatedAt; exMap = null; changed = true;
    } else if (state._mt.meta && (state._mt.meta > ((rm && rm.updatedAt)||0))) dirty.add("meta");
    for (const [docId, data] of Object.entries(remote)) {
      if (!docId.startsWith("m-")) continue;
      const mk = docId.slice(2);
      if ((data.updatedAt||0) > (state._mt[mk]||0)) {
        for (const k of Object.keys(state.days)) if (k.startsWith(mk)) delete state.days[k];
        Object.assign(state.days, clone(data.days||{}));
        state._mt[mk] = data.updatedAt; changed = true;
      }
    }
    for (const mk of Object.keys(state._mt)) {
      if (mk === "meta") continue;
      const r = remote["m-" + mk];
      if (!r || state._mt[mk] > (r.updatedAt||0)) dirty.add(mk);
    }
    if (Object.keys(remote).length && state.demo) { state.demo = false; changed = true; }
    cloudState = "on";
    if (changed) { saveLocal(); render(); }
    flush();
  } catch(e) { cloudState = "error"; }
  finally { if (cloudState === "connecting") cloudState = "off"; renderSync(); }
}

  const o = { ex:0, sets:0, reps:0, vol:0, maxRm:0, min:0, km:0, parts:new Set() };
  if (!d) return o;

}

function niceTicks(lo, hi, n = 4){
  if (lo === hi) { const pad = Math.abs(lo) * 0.1 || 1; lo -= pad; hi += pad; }
  const span = hi - lo; let step = Math.pow(10, Math.floor(Math.log10(span / n)));
  const e = span / n / step; step *= e >= 7.5 ? 10 : e >= 3.5 ? 5 : e >= 1.5 ? 2 : 1;
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, t = [];

  return t;
}
function lineChart(pts, opt = {}){

      let b = c.P[0]; for (const p of c.P) if (Math.abs(p.x - vx) < Math.abs(b.x - vx)) b = p;

      hi.setAttribute("cx", b.x); hi.setAttribute("cy", b.yy); hi.setAttribute("visibility", "visible");
      tip.hidden = false; tip.innerHTML = `<span>${fmtDate(b.k)}</span><b>${c.fmt(b.y)}</b>`;
      const px = b.x / W * r.width, half = tip.offsetWidth / 2;
      tip.style.left = Math.min(Math.max(px, half), r.width - half) + "px";
    };
    const hide = () => { gl.setAttribute("visibility", "hidden"); hi.setAttribute("visibility", "hidden"); tip.hidden = true; };
    svg.addEventListener("pointermove", show); svg.addEventListener("pointerdown", show); svg.addEventListener("pointerleave", hide);
  });
}

/* ---------- rest timer ---------- */
const timer = { end:0, total:0, id:null, fin:false, hideAt:0 };
let actx = null, wake = null;
function ensureAudio(){ try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch(e) {} }
function beep(){
  if (!actx) return;
  try { [0, .28, .56].forEach(t => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.001, actx.currentTime + t); g.gain.exponentialRampToValueAtTime(.35, actx.currentTime + t + .02); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + t + .22); o.start(actx.currentTime + t); o.stop(actx.currentTime + t + .25); }); } catch(e) {}
}
function startRest(sec){
  ensureAudio();
  timer.total = sec; timer.end = Date.now() + sec*1000; timer.fin = false;
  clearInterval(timer.id); timer.id = setInterval(tickTimer, 250); tickTimer();
  try { navigator.wakeLock && navigator.wakeLock.request("screen").then(l => wake = l).catch(() => {}); } catch(e) {}
}
function stopRest(){ clearInterval(timer.id); timer.id = null; $("#timerbar").hidden = true; try { wake && wake.release(); } catch(e) {} wake = null; }
function tickTimer(){
  const bar = $("#timerbar"), left = Math.max(0, timer.end - Date.now());
  if (left <= 0 && !timer.fin) { timer.fin = true; timer.hideAt = Date.now() + 10000; beep(); try { navigator.vibrate && navigator.vibrate([250,120,250]); } catch(e) {} }
  if (timer.fin && Date.now() > timer.hideAt) return stopRest();
  const s = Math.ceil(left / 1000);
  bar.hidden = false; bar.className = timer.fin ? "fin" : "";
  bar.innerHTML = timer.fin
    ? `<span class="t num">0:00</span><span class="lbl">休憩終了。次のセットへ</span><button data-act="timerStop">閉じる</button>`
    : `<span class="t num">${Math.floor(s/60)}:${pad(s%60)}</span><span class="lbl">休憩中</span><button data-act="timerAdd">＋15秒</button><button data-act="timerStop">終了</button><span class="prog" style="width:${(1 - left/(timer.total*1000))*100}%"></span>`;
}

function monthGrid(ym, cellFn){

}

function roundTo(v, step){ return step > 0 ? Math.round(v / step) * step : v; }

function bindRmq(){
  const row = $("#rmqChips"), th = $("#rmqThumb"), wrap = row && row.parentElement, sw = $("#rmqSwipe");
  if (!row || !th) return;
  const upd = () => {
    const max = row.scrollWidth - row.clientWidth, frac = row.scrollWidth ? row.clientWidth / row.scrollWidth : 1;
    th.style.width = Math.max(12, frac * 100) + "%";
    th.style.left = (max > 0 ? row.scrollLeft / max * (100 - frac * 100) : 0) + "%";

  pickEdit: () => { ui.pickEdit = !ui.pickEdit; armed = null; render(); },
  partColor: d => { exitDemo(); const p = state.parts.find(p => p.id === d.p); p.color = COLORS[(COLORS.indexOf(p.color) + 1) % COLORS.length]; markDirty("meta"); render(); },
  delEx: d => { exitDemo(); const p = state.parts.find(p => p.id === d.p); const e = p.ex.find(e => e.id === d.ex); if (sessions(e.id).length) e.archived = true; else p.ex = p.ex.filter(x => x !== e); markDirty("meta"); armed = null; render(); },
  delPart: d => { exitDemo(); const p = state.parts.find(p => p.id === d.p); if (p.ex.some(e => sessions(e.id).length)) { p.archived = true; p.ex.forEach(e => e.archived = true); } else state.parts = state.parts.filter(x => x !== p); markDirty("meta"); armed = null; render(); toast(`「${p.name}」を削除しました`); },
  unit: d => { exitDemo(); state.settings.unit = d.u; markDirty("meta"); render(); },
  restAdj: d => { exitDemo(); state.settings.rest = Math.min(900, Math.max(15, state.settings.rest + +d.n)); markDirty("meta"); render(); },
  restStart: () => startRest(state.settings.rest),
  timerAdd: () => { timer.end += 15000; timer.total += 15; tickTimer(); },
  timerStop: stopRest,
  addSet: () => {
    const w = mutW(view.date, view.ex), p = w.sets[w.sets.length - 1] || {};
    const nw = p.w > 0 ? (methodOf(w) === "asc" ? p.w + (w.step || 2.5) : p.w) : 0;
    w.sets.push(isCardioEx(view.ex) ? {} : (nw > 0 ? { w:nw } : {})); commitDay(view.date); render();
    const i = w.sets.length - 1, el = $(isCardioEx(view.ex) ? `#min-${i}` : (w.sets[i].w ? `#r-${i}` : `#w-${i}`)); if (el) { el.focus(); el.scrollIntoView({ block:"center" }); }
  },
  sameSet: d => { const w = mutW(view.date, view.ex), i = +d.i, p = w.sets[i-1]; if (!p) return; Object.assign(w.sets[i], { w:p.w, r:p.r, a:p.a, ar:p.ar, min:p.min, km:p.km }); commitDay(view.date); render(); },
  doneSet: d => { const w = mutW(view.date, view.ex), s = w.sets[+d.i]; s.d = !s.d; commitDay(view.date); render(); if (s.d && validSet(s, isCardioEx(view.ex)) && !isCardioEx(view.ex)) startRest(state.settings.rest); },
  assistSet: d => { const w = mutW(view.date, view.ex), s = w.sets[+d.i]; s.a = d.v === "1"; if (!s.a) s.ar = null; commitDay(view.date); render(); if (s.a) { const el = $(`#ar-${d.i}`); if (el) el.focus(); } },
  feelSet: d => { const w = mutW(view.date, view.ex), s = w.sets[+d.i]; s.feel = s.feel === +d.v ? null : +d.v; commitDay(view.date); render(); },
  tagSet: d => { const w = mutW(view.date, view.ex), s = w.sets[+d.i]; s.tags = s.tags || []; s.tags = s.tags.includes(d.t) ? s.tags.filter(t => t !== d.t) : s.tags.concat(d.t); if (!s.tags.length) delete s.tags; commitDay(view.date); render(); },
  condToggle: d => { const i = +d.i; condOpen.has(i) ? condOpen.delete(i) : condOpen.add(i); render(); if (condOpen.has(i)) { const el = $(`#m-${i}`); if (el) el.scrollIntoView({ block:"nearest" }); } },
  delSet: d => { condOpen.clear(); const w = mutW(view.date, view.ex); w.sets.splice(+d.i, 1); if (!w.sets.length) w.sets.push({}); commitDay(view.date); render(); },
  copyLast: () => {
    const ls = lastSession(view.ex, view.date); if (!ls) return;
    const w = mutW(view.date, view.ex);
    w.sets = w.sets.filter(nonEmpty).concat(ls.sets.map(s => { const c = { ...s }; delete c.d; delete c.m; delete c.feel; delete c.tags; return c; }));
    commitDay(view.date); render(); toast("前回の記録をコピーしました。今日の値に直してください");
  },
  setMethod: d => {
    const k = view.date, m = d.m, M = METHODS[m], w = mutW(k, view.ex);
    if (!w.sets.length) w.sets.push({});
    if (M.group) {
      if (!w.grp) w.grp = uid();
      groupOf(state.days[k], w.grp).forEach(x => x.method = m);
      commitDay(k); condOpen.clear(); armed = null;
      view = { name:"grp", date:k, grp:w.grp }; render(true); return;
    }
    if (w.grp) ungroupOne(k, w);
    w.method = m; commitDay(k); render();
  },
  setMethodG: d => { const k = view.date, day = mutDay(k); groupOf(day, view.grp).forEach(x => x.method = d.m); commitDay(k); render(); },
  mParam: d => {
    const w = mutW(view.date, view.ex), n = +d.n;
    const cyc = (opts, cur) => { let i = opts.indexOf(cur); if (i < 0) i = Math.max(0, opts.findIndex(o => o >= cur)); return opts[Math.min(opts.length - 1, Math.max(0, i + n))]; };
    if (d.key === "dropPct") w.dropPct = cyc(DROP_OPTS, w.dropPct || 20);
    if (d.key === "pause") w.pause = cyc(PAUSE_OPTS, w.pause || 15);
    if (d.key === "step") w.step = cyc(STEP_OPTS, w.step || 2.5);
    commitDay(view.date); render();
  },
  addSub: d => {
    const w = mutW(view.date, view.ex), i = +d.i, s = w.sets[i], m = methodOf(w);
    s.sub = s.sub || [];
    const prev = s.sub.length ? s.sub[s.sub.length - 1] : s;
    let nw = prev.w;
    if (m === "drop" && prev.w > 0) nw = fromD(roundTo(toD(prev.w * (1 - (w.dropPct || 20) / 100)), state.settings.round || 0.5));
    s.sub.push({ w: nw > 0 ? nw : null, r: null }); commitDay(view.date); render();
    if (m === "restpause") startRest(w.pause || 15);
    const el = $(`#sr-${i}-${s.sub.length - 1}`); if (el) el.focus();
  },
  delSub: d => { const w = mutW(view.date, view.ex), s = w.sets[+d.i]; s.sub.splice(+d.j, 1); if (!s.sub.length) delete s.sub; commitDay(view.date); render(); },
  grpAdd: () => { ui.pickQ = ""; go("pick", { date:view.date, addTo:view.grp }); },
  grpRemove: d => {
    const k = view.date, day = mutDay(k), w = day.w.find(x => x.ex === d.ex); if (!w) return;
    const grp = w.grp; ungroupOne(k, w);
    w.sets = w.sets.filter(nonEmpty); if (!w.sets.length) day.w.splice(day.w.indexOf(w), 1);
    commitDay(k);
    if (groupOf(day, grp).length) render(); else { view = stack.pop() || { name:"day", date:k }; render(true); }
  },
  grpUngroup: () => {
    const k = view.date, day = mutDay(k);
    groupOf(day, view.grp).forEach(w => { delete w.grp; w.method = "straight"; w.sets = w.sets.filter(nonEmpty); });
    day.w = day.w.filter(w => w.grp || w.sets.length);
    commitDay(k); view = stack.pop() || { name:"day", date:k }; render(true); toast("セットを解除しました");
  },
  grpAddRound: () => {
    const k = view.date, day = mutDay(k), ms = groupOf(day, view.grp), R = Math.max(1, ...ms.map(w => w.sets.length));
    ms.forEach(w => { while (w.sets.length < R) w.sets.push({}); const p = w.sets[R-1] || {}; w.sets.push(p.w > 0 ? { w:p.w } : {}); });
    commitDay(k); render();
    const el = $(`#g-0-${R}-r`) || $(`#g-0-${R}-w`) || $(`#g-0-${R}-min`); if (el) { el.focus(); el.scrollIntoView({ block:"center" }); }
  },
  grpDelRound: d => { const k = view.date, day = mutDay(k), r = +d.r; groupOf(day, view.grp).forEach(w => { if (w.sets.length > r) w.sets.splice(r, 1); if (!w.sets.length) w.sets.push({}); }); commitDay(k); render(); },
  grpDone: d => {
    const k = view.date, day = mutDay(k), r = +d.r, ms = groupOf(day, view.grp);
    const on = !ms.every(w => w.sets[r] && w.sets[r].d);
    ms.forEach(w => { while (w.sets.length <= r) w.sets.push({}); w.sets[r].d = on; });
    commitDay(k); render(); if (on) startRest(state.settings.rest);
  },
  rmqToggle: () => { ui.rmqOpen = !ui.rmqOpen; render(); },
  rmPick: d => {
    const w = mutW(view.date, view.ex);
    let t = w.sets.find(x => !(x.w > 0) && !(x.r > 0));
    if (!t) { t = {}; w.sets.push(t); }
    t.w = +d.kg; t.r = +d.r; commitDay(view.date); render();
    toast(`${fmtW(+d.kg)}${U()} × ${d.r}回 を入力しました`);
  },
  histPart: d => { ui.histPart = d.p; render(); },
  histMode: d => { ui.histMode = d.m; render(); },
  histRange: d => { ui.histRange = +d.r; render(); },
  histMonth: d => { ui.histMonth = shiftYM(ui.histMonth, +d.n); render(); },
  bodyShift: d => { ui.bodyDate = addDays(ui.bodyDate, +d.n); render(); },
  bodyMetric: d => { ui.bodyMetric = d.m; render(); },
  bodyRange: d => { ui.bodyRange = +d.r; render(); },
  rmMode: d => { if (d.m === "one" && ui.rmMode === "wr" && ui.rmW > 0 && ui.rmR > 0) ui.rmOne = round1(ui.rmR === 1 ? ui.rmW : fm().f(ui.rmW, ui.rmR)); ui.rmMode = d.m; render(); },
  export: async () => {
    const data = JSON.stringify({ app:"REP", version:1, exportedAt:new Date().toISOString(), settings:state.settings, parts:state.parts, days:state.days }, null, 1);
    const name = `rep-${todayK()}.json`;
    try {
      const file = new File([data], name, { type:"application/json" });
      if (navigator.canShare && navigator.canShare({ files:[file] })) { await navigator.share({ files:[file], title:"REP バックアップ" }); toast("書き出しました"); return; }
    } catch(e) { if (e && e.name === "AbortError") return; }
    try {
      const url = URL.createObjectURL(new Blob([data], { type:"application/json" }));
      const el = document.createElement("a"); el.href = url; el.download = name; document.body.appendChild(el); el.click(); el.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000); toast("書き出しました"); return;
    } catch(e) {}
    ui.exportText = data; render();
  },
  copyExport: async () => { const ta = $("#expText"); try { await navigator.clipboard.writeText(ta.value); toast("コピーしました"); } catch(e) { ta.focus(); ta.select(); toast("選択しました。コピーしてください"); } },
  importPick: () => $("#importFile").click(),
  importCancel: () => { ui.importData = null; render(); },
  importApply: () => {
    const d = ui.importData; if (!d) return;
    const oldMonths = Object.keys(state._mt).filter(k => k !== "meta");
    state.demo = false;
    state.settings = { ...DEFAULT_SETTINGS, ...(d.settings || {}) };
    state.parts = d.parts; state.days = d.days; exMap = null;
    const months = new Set([...oldMonths, ...Object.keys(d.days).map(k => k.slice(0, 7))]);
    markDirty("meta"); months.forEach(m => markDirty(m));
    ui.importData = null; render(); toast("読み込みました");
  }
};

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t) { if (armed) { armed = null; render(); } return; }
  const act = t.dataset.act;
  if (armed && act !== "arm" && !["delW","delEx","delPart"].includes(act)) armed = null;
  try { A[act] && A[act](t.dataset, t); } catch(err) { if (err && err.message !== "wait") console.error(err); }
});
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form]"); if (!f) return;
  e.preventDefault();
  try {
    if (f.dataset.form === "addEx") {
      const inp = f.querySelector("input"), name = inp.value.trim(); if (!name) return;
      exitDemo(); const p = state.parts.find(p => p.id === f.dataset.p);
      p.ex.push({ id:uid(), name }); markDirty("meta"); render(); toast(`「${name}」を追加しました`);
    } else if (f.dataset.form === "addPart") {
      const inp = f.querySelector("input"), name = inp.value.trim(); if (!name) return;
      exitDemo(); state.parts.push({ id:uid(), name, color:COLORS[state.parts.length % COLORS.length], kind:"weight", ex:[] }); markDirty("meta"); render();
    }
  } catch(err) { if (err && err.message !== "wait") console.error(err); }
});

const B = {
  set: t => {
    const i = +t.dataset.i, f = t.dataset.f, w = mutW(view.date, view.ex), s = w.sets[i]; if (!s) return;
    if (f === "sw" || f === "sr") { const x = (s.sub || [])[+t.dataset.j]; if (!x) return; const v = num(t.value); if (f === "sw") x.w = v > 0 ? fromD(v) : null; else x.r = v > 0 ? Math.round(v) : null; commitDay(view.date); return; }
    if (f === "m") s.m = t.value;
    else { const v = num(t.value); if (f === "w") s.w = v > 0 ? fromD(v) : null; else if (f === "r" || f === "ar") s[f] = v > 0 ? Math.round(v) : null; else s[f] = v > 0 ? v : null; }
    const rmEl = $(`#rm-${i}`); if (rmEl) rmEl.textContent = rmText(s);
    commitDay(view.date);
  },
  body: t => {
    const d = mutDay(ui.bodyDate); d.b = d.b || {};
    const f = t.dataset.f;
    if (f === "memo") d.b.memo = t.value || null; else { const v = num(t.value); d.b[f] = v > 0 ? v : null; }
    $("#bcalc").innerHTML = bodyCalcHtml(d.b);
    commitDay(ui.bodyDate);
  },
  rm: t => {
    const v = num(t.value);
    if (t.dataset.f === "rmR") ui.rmR = v > 0 ? Math.round(v) : 0; else ui[t.dataset.f] = v > 0 ? v : 0;
    let one = ui.rmMode === "wr" ? ((ui.rmW > 0 && ui.rmR > 0) ? (ui.rmR === 1 ? ui.rmW : fm().f(ui.rmW, ui.rmR)) : 0) : ui.rmOne;
    $("#rmOut").innerHTML = `${one ? trimNum(round1(one), 1) : "—"}<small>${U()}</small>`;
    const tmp = document.createElement("div"); tmp.innerHTML = vRm(); $("#rmTables").innerHTML = tmp.querySelector("#rmTables").innerHTML;
  },
  setting: t => {
    exitDemo();
    const f = t.dataset.f, s = state.settings;
    if (f === "formula") s.formula = t.value;
    else if (f === "round") s.round = +t.value;
    else if (f === "height") { const v = num(t.value); s.height = v > 50 && v < 260 ? v : null; }
    else if (f === "rest") { const v = num(t.value); if (v >= 5 && v <= 900) s.rest = Math.round(v); }
    markDirty("meta");
    if (t.tagName === "SELECT") render();
  },
  pickQ: t => { ui.pickQ = t.value; const tmp = document.createElement("div"); tmp.innerHTML = vPick(); $("#pickList").innerHTML = tmp.querySelector("#pickList").innerHTML; },
  renEx: t => { exitDemo(); const f = findEx(t.dataset.ex); const n = t.value.trim(); if (f && n) { f.ex.name = n; markDirty("meta"); } },
  renPart: t => { exitDemo(); const p = state.parts.find(p => p.id === t.dataset.p); const n = t.value.trim(); if (p && n) { p.name = n; markDirty("meta"); } },
  histEx: t => { ui.histEx = t.value; render(); },
  gset: t => {
    const k = view.date, day = mutDay(k), w = day.w.find(x => x.ex === t.dataset.ex); if (!w) return;
    const r = +t.dataset.r; while (w.sets.length <= r) w.sets.push({});
    const s = w.sets[r], v = num(t.value), f = t.dataset.f;
    if (f === "w") s.w = v > 0 ? fromD(v) : null; else if (f === "r") s.r = v > 0 ? Math.round(v) : null; else s[f] = v > 0 ? v : null;
    commitDay(k);
  },
  rmqBase: t => { const v = num(t.value); if (v > 0) ui.rmBase[view.ex] = fromD(v); else delete ui.rmBase[view.ex]; const el = $("#rmqChips"); if (el) { el.innerHTML = rmqChips(view.ex); bindRmq(); } }
};
function handleBind(e){
  const t = e.target; const b = t.dataset && t.dataset.bind; if (!b || !B[b]) return;
  if (t.tagName === "SELECT" && e.type === "input") return;
  try { B[b](t); } catch(err) { if (err && err.message === "wait") { render(); } else console.error(err); }
}
document.addEventListener("input", handleBind);
document.addEventListener("change", e => { if (e.target.tagName === "SELECT") handleBind(e); });
document.addEventListener("focusin", e => {
  if (!state.demo) return;
  const t = e.target;
  if (t.matches("input[data-bind='set'],input[data-bind='gset'],textarea[data-bind='set'],input[data-bind='body'],input[data-bind='renEx'],input[data-bind='renPart']")) {
    const id = t.id;
    try { exitDemo(); } catch(err) { t.blur(); return; }
    render(); const el = document.getElementById(id); if (el) el.focus();
  }
});
$("#importFile").addEventListener("change", e => {
  const file = e.target.files && e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.parts) || typeof d.days !== "object") throw new Error("bad");
      ui.importData = d; render();
    } catch(err) { toast("このファイルは読み込めません。REPで書き出したJSONファイルを選んでください"); }
    e.target.value = "";
  };
  r.readAsText(file);
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); else if (timer.id) tickTimer(); });

/* ---------- boot ---------- */
hadLocal = loadLocal();
if (!hadLocal) state.demo = true;
DEMO = makeDemo();
render(true);
cloudState = "off";
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e) {}
if ("serviceWorker" in navigator) {
  const hadCtl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("./sw.js").then(reg => {
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
  }).catch(() => {});
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadCtl) $("#updbar").hidden = false; });
}
</script>
